[pytest]
; `pytest` at repo root runs the whole publishable verification surface:
; the decoder-stack unit tests and the recipe-pipeline tests that pin the
; canonical lexicon and byte-level reproducibility of the committed
; translations. The image-native suite (tests/image_native) has heavy
; optional dependencies and runs separately:
;   pytest tests/image_native
testpaths =
    zfd_decoder/tests
    06_Pipelines/tests
